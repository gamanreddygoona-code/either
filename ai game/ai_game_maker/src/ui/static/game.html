<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Generated Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #222;
            color: white;
            overflow: hidden;
            user-select: none;
        }
        
        #gameContainer {
            display: flex;
            height: 100vh;
        }
        
        #gameCanvas {
            background-color: #111;
            display: block;
        }
        
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 14px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
        }
        
        #hud .stat {
            margin-bottom: 5px;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        
        #gameOver h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ff4444;
        }
        
        #gameOver p {
            font-size: 18px;
            margin-bottom: 20px;
        }
        
        #restartBtn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        #restartBtn:hover {
            background-color: #45a049;
        }
        
        #instructions {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 12px;
            display: flex;
            gap: 20px;
        }
        
        #instructions span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        #instructions kbd {
            background-color: #333;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="hud">
            <div class="stat">Score: <span id="score">0</span></div>
            <div class="stat">Health: <span id="health">100</span></div>
            <div class="stat">Level: <span id="level">1</span></div>
        </div>
        <div id="gameOver">
            <h1>GAME OVER</h1>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button id="restartBtn" onclick="restartGame()">Play Again</button>
        </div>
        <div id="instructions">
            <span><kbd>←</kbd><kbd>→</kbd> Move</span>
            <span><kbd>↑</kbd> Jump</span>
            <span><kbd>SPACE</kbd> Shoot</span>
            <span><kbd>R</kbd> Restart</span>
        </div>
    </div>
    
    <script>
        // Game state
        const gameState = {
            player: {
                x: 100,
                y: 100,
                width: 40,
                height: 80,
                speed: 5,
                jumpForce: 10,
                velocityX: 0,
                velocityY: 0,
                isGrounded: true,
                health: 100,
                score: 0
            },
            platforms: [],
            enemies: [],
            collectibles: [],
            projectiles: [],
            gravity: 0.8,
            gameOver: false,
            gameWon: false,
            gameStarted: false
        };
        
        // Canvas
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Load game design from local storage
        let gameDesign = null;
        try {
            const saved = localStorage.getItem('aiGameMaker_currentGame');
            if (saved) {
                gameDesign = JSON.parse(saved);
                setupGameFromDesign(gameDesign);
            }
        } catch (e) {
            console.error('Error loading game design:', e);
        }
        
        // If no design, create a simple test level
        if (!gameDesign) {
            createTestLevel();
        }
        
        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        // Setup game from design
        function setupGameFromDesign(design) {
            gameDesign = design;
            
            // Create platforms from game elements
            const level = design.levels[0];
            if (level && level.elements) {
                level.elements.forEach(element => {
                    const x = element.x * (canvas.width / 640);
                    const y = element.y * (canvas.height / 480);
                    const width = element.width * (canvas.width / 640);
                    const height = element.height * (canvas.height / 480);
                    
                    switch (element.type) {
                        case 'platform':
                            gameState.platforms.push({
                                x: x,
                                y: y,
                                width: width,
                                height: height,
                                color: '#198754'
                            });
                            break;
                        case 'enemy':
                            gameState.enemies.push({
                                x: x,
                                y: y,
                                width: width,
                                height: height,
                                speed: element.properties.speed || 2,
                                direction: 1,
                                range: element.properties.move_range || 200,
                                originalX: x,
                                damage: element.properties.damage || 20,
                                color: '#dc3545'
                            });
                            break;
                        case 'collectible':
                            gameState.collectibles.push({
                                x: x,
                                y: y,
                                width: width,
                                height: height,
                                scoreValue: element.properties.score_value || 10,
                                color: '#ffc107'
                            });
                            break;
                        case 'player':
                            gameState.player.x = x;
                            gameState.player.y = y;
                            gameState.player.speed = element.properties.speed || 5;
                            gameState.player.jumpForce = element.properties.jump_force || 10;
                            break;
                    }
                });
            }
            
            // If no player position set, use default
            if (gameState.player.x === 100 && gameState.player.y === 100) {
                // Place player on first platform if exists
                if (gameState.platforms.length > 0) {
                    const platform = gameState.platforms[0];
                    gameState.player.x = platform.x + platform.width / 2 - gameState.player.width / 2;
                    gameState.player.y = platform.y - gameState.player.height;
                }
            }
            
            // Add ground platform if none exists
            if (gameState.platforms.length === 0) {
                gameState.platforms.push({
                    x: 0,
                    y: canvas.height - 20,
                    width: canvas.width,
                    height: 20,
                    color: '#333'
                });
            }
        }
        
        // Create test level
        function createTestLevel() {
            // Ground
            gameState.platforms.push({
                x: 0,
                y: canvas.height - 20,
                width: canvas.width,
                height: 20,
                color: '#333'
            });
            
            // Some platforms
            for (let i = 0; i < 5; i++) {
                gameState.platforms.push({
                    x: 200 + i * 150,
                    y: canvas.height - 100 - Math.random() * 50,
                    width: 100 + Math.random() * 50,
                    height: 20,
                    color: '#198754'
                });
            }
            
            // Some enemies
            for (let i = 0; i < 3; i++) {
                gameState.enemies.push({
                    x: 400 + i * 200,
                    y: canvas.height - 80,
                    width: 40,
                    height: 60,
                    speed: 2 + Math.random() * 2,
                    direction: Math.random() > 0.5 ? 1 : -1,
                    range: 200,
                    originalX: 400 + i * 200,
                    damage: 20,
                    color: '#dc3545'
                });
            }
            
            // Some collectibles
            for (let i = 0; i < 5; i++) {
                gameState.collectibles.push({
                    x: 300 + i * 100,
                    y: canvas.height - 150 - Math.random() * 100,
                    width: 30,
                    height: 30,
                    scoreValue: 10 + Math.random() * 20,
                    color: '#ffc107'
                });
            }
            
            // Place player
            gameState.player.x = 100;
            gameState.player.y = canvas.height - 100;
        }
        
        // Input handling
        const keys = {
            left: false,
            right: false,
            up: false,
            space: false,
            r: false
        };
        
        window.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'ArrowLeft':
                    keys.left = true;
                    break;
                case 'ArrowRight':
                    keys.right = true;
                    break;
                case 'ArrowUp':
                    keys.up = true;
                    break;
                case 'Space':
                    keys.space = true;
                    break;
                case 'KeyR':
                    keys.r = true;
                    break;
            }
        });
        
        window.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'ArrowLeft':
                    keys.left = false;
                    break;
                case 'ArrowRight':
                    keys.right = false;
                    break;
                case 'ArrowUp':
                    keys.up = false;
                    break;
                case 'Space':
                    keys.space = false;
                    break;
                case 'KeyR':
                    keys.r = false;
                    break;
            }
        });
        
        // Shoot function
        function shoot() {
            if (!gameState.gameStarted) {
                gameState.gameStarted = true;
            }
            
            gameState.projectiles.push({
                x: gameState.player.x + gameState.player.width / 2 - 5,
                y: gameState.player.y + gameState.player.height / 2 - 5,
                width: 10,
                height: 10,
                speed: 10,
                direction: keys.right ? 1 : -1,
                damage: 10,
                lifetime: 2.0,
                timeAlive: 0,
                color: '#ffffff'
            });
        }
        
        // Restart game
        function restartGame() {
            // Reset player
            gameState.player.x = 100;
            gameState.player.y = 100;
            gameState.player.velocityX = 0;
            gameState.player.velocityY = 0;
            gameState.player.isGrounded = false;
            gameState.player.health = 100;
            gameState.player.score = 0;
            
            // Reset enemies
            gameState.enemies.forEach(enemy => {
                enemy.x = enemy.originalX;
                enemy.direction = Math.random() > 0.5 ? 1 : -1;
            });
            
            // Reset collectibles (they will be regenerated)
            gameState.collectibles = [];
            if (gameDesign) {
                const level = gameDesign.levels[0];
                if (level && level.elements) {
                    level.elements.forEach(element => {
                        if (element.type === 'collectible') {
                            const x = element.x * (canvas.width / 640);
                            const y = element.y * (canvas.height / 480);
                            const width = element.width * (canvas.width / 640);
                            const height = element.height * (canvas.height / 480);
                            
                            gameState.collectibles.push({
                                x: x,
                                y: y,
                                width: width,
                                height: height,
                                scoreValue: element.properties.score_value || 10,
                                color: '#ffc107'
                            });
                        }
                    });
                }
            } else {
                // Recreate test collectibles
                for (let i = 0; i < 5; i++) {
                    gameState.collectibles.push({
                        x: 300 + i * 100,
                        y: canvas.height - 150 - Math.random() * 100,
                        width: 30,
                        height: 30,
                        scoreValue: 10 + Math.random() * 20,
                        color: '#ffc107'
                    });
                }
            }
            
            // Clear projectiles
            gameState.projectiles = [];
            
            // Reset game state
            gameState.gameOver = false;
            gameState.gameWon = false;
            gameState.gameStarted = false;
            
            // Hide game over screen
            document.getElementById('gameOver').style.display = 'none';
            
            // Update HUD
            updateHUD();
        }
        
        // Update HUD
        function updateHUD() {
            document.getElementById('score').textContent = gameState.player.score;
            document.getElementById('health').textContent = gameState.player.health;
        }
        
        // Check collisions
        function checkCollisions() {
            const player = gameState.player;
            
            // Check platform collisions
            player.isGrounded = false;
            
            gameState.platforms.forEach(platform => {
                if (player.x < platform.x + platform.width &&
                    player.x + player.width > platform.x &&
                    player.y < platform.y + platform.height &&
                    player.y + player.height > platform.y) {
                    
                    // Player is colliding with platform
                    if (player.velocityY > 0 && player.y + player.height > platform.y + 10) {
                        // Landing on top of platform
                        player.y = platform.y - player.height;
                        player.velocityY = 0;
                        player.isGrounded = true;
                    }
                }
            });
            
            // Check enemy collisions with player
            gameState.enemies.forEach(enemy => {
                if (player.x < enemy.x + enemy.width &&
                    player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + player.height > enemy.y) {
                    
                    // Player hit by enemy
                    player.health -= enemy.damage;
                    
                    // Push player back
                    if (player.x + player.width/2 < enemy.x + enemy.width/2) {
                        player.x = enemy.x - player.width;
                    } else {
                        player.x = enemy.x + enemy.width;
                    }
                    
                    if (player.health <= 0) {
                        gameState.gameOver = true;
                        document.getElementById('finalScore').textContent = player.score;
                        document.getElementById('gameOver').style.display = 'block';
                    }
                }
            });
            
            // Check projectile collisions with enemies
            gameState.projectiles.forEach((projectile, pIndex) => {
                gameState.enemies.forEach((enemy, eIndex) => {
                    if (projectile.x < enemy.x + enemy.width &&
                        projectile.x + projectile.width > enemy.x &&
                        projectile.y < enemy.y + enemy.height &&
                        projectile.y + projectile.height > enemy.y) {
                        
                        // Hit enemy
                        enemy.health -= projectile.damage;
                        
                        if (enemy.health <= 0) {
                            gameState.enemies.splice(eIndex, 1);
                        }
                        
                        // Remove projectile
                        gameState.projectiles.splice(pIndex, 1);
                        return;
                    }
                });
            });
            
            // Check collectible collisions
            gameState.collectibles.forEach((collectible, cIndex) => {
                if (player.x < collectible.x + collectible.width &&
                    player.x + player.width > collectible.x &&
                    player.y < collectible.y + collectible.height &&
                    player.y + player.height > collectible.y) {
                    
                    // Collect item
                    player.score += collectible.scoreValue;
                    gameState.collectibles.splice(cIndex, 1);
                    
                    // Check win condition
                    if (gameState.collectibles.length === 0) {
                        gameState.gameWon = true;
                        document.getElementById('finalScore').textContent = player.score;
                        document.getElementById('gameOver').querySelector('h1').textContent = 'YOU WIN!';
                        document.getElementById('gameOver').style.display = 'block';
                    }
                }
            });
        }
        
        // Update game objects
        function updateGame(deltaTime) {
            const player = gameState.player;
            
            // Player movement
            if (keys.left) {
                player.velocityX = -player.speed;
            } else if (keys.right) {
                player.velocityX = player.speed;
            } else {
                player.velocityX *= 0.8; // Friction
            }
            
            // Jumping
            if (keys.up && player.isGrounded) {
                player.velocityY = -player.jumpForce;
                player.isGrounded = false;
            }
            
            // Shooting
            if (keys.space) {
                shoot();
                keys.space = false; // Prevent continuous shooting
            }
            
            // Restart
            if (keys.r) {
                restartGame();
                keys.r = false;
            }
            
            // Apply gravity
            if (!player.isGrounded) {
                player.velocityY += gameState.gravity;
            }
            
            // Update player position
            player.x += player.velocityX * deltaTime * 60;
            player.y += player.velocityY * deltaTime * 60;
            
            // Keep player in bounds
            if (player.x < 0) {
                player.x = 0;
            }
            if (player.x + player.width > canvas.width) {
                player.x = canvas.width - player.width;
            }
            if (player.y < 0) {
                player.y = 0;
                player.velocityY = 0;
            }
            if (player.y + player.height > canvas.height) {
                player.y = canvas.height - player.height;
                player.velocityY = 0;
                player.isGrounded = true;
            }
            
            // Update enemies
            gameState.enemies.forEach(enemy => {
                // Move enemy
                enemy.x += enemy.speed * enemy.direction * deltaTime * 60;
                
                // Check bounds
                if (enemy.x > enemy.originalX + enemy.range) {
                    enemy.direction = -1;
                } else if (enemy.x < enemy.originalX - enemy.range) {
                    enemy.direction = 1;
                }
            });
            
            // Update projectiles
            gameState.projectiles.forEach((projectile, index) => {
                projectile.x += projectile.speed * projectile.direction * deltaTime * 60;
                projectile.timeAlive += deltaTime;
                
                // Remove expired projectiles
                if (projectile.timeAlive >= projectile.lifetime) {
                    gameState.projectiles.splice(index, 1);
                }
            });
            
            // Check collisions
            checkCollisions();
            
            // Update HUD
            updateHUD();
        }
        
        // Draw game
        function drawGame() {
            // Clear canvas
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw platforms
            gameState.platforms.forEach(platform => {
                ctx.fillStyle = platform.color;
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                ctx.strokeStyle = '#000';
                ctx.strokeRect(platform.x, platform.y, platform.width, platform.height);
            });
            
            // Draw collectibles
            gameState.collectibles.forEach(collectible => {
                ctx.fillStyle = collectible.color;
                ctx.beginPath();
                ctx.arc(
                    collectible.x + collectible.width / 2,
                    collectible.y + collectible.height / 2,
                    collectible.width / 2,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.stroke();
            });
            
            // Draw enemies
            gameState.enemies.forEach(enemy => {
                ctx.fillStyle = enemy.color;
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                ctx.strokeStyle = '#000';
                ctx.strokeRect(enemy.x, enemy.y, enemy.width, enemy.height);
                
                // Draw angry eyes
                const eyeSize = 4;
                const leftEyeX = enemy.x + 10;
                const leftEyeY = enemy.y + 15;
                const rightEyeX = enemy.x + enemy.width - 10;
                
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(leftEyeX, leftEyeY, eyeSize, 0, Math.PI * 2);
                ctx.arc(rightEyeX, leftEyeY, eyeSize, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(leftEyeX, leftEyeY, eyeSize / 2, 0, Math.PI * 2);
                ctx.arc(rightEyeX, leftEyeY, eyeSize / 2, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Draw projectiles
            gameState.projectiles.forEach(projectile => {
                ctx.fillStyle = projectile.color;
                ctx.beginPath();
                ctx.arc(
                    projectile.x + projectile.width / 2,
                    projectile.y + projectile.height / 2,
                    projectile.width / 2,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            });
            
            // Draw player
            const player = gameState.player;
            ctx.fillStyle = '#0d6efd';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.strokeStyle = '#000';
            ctx.strokeRect(player.x, player.y, player.width, player.height);
            
            // Draw player eyes
            const eyeSize = 5;
            const leftEyeX = player.x + 15;
            const leftEyeY = player.y + 20;
            const rightEyeX = player.x + player.width - 15;
            
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(leftEyeX, leftEyeY, eyeSize, 0, Math.PI * 2);
            ctx.arc(rightEyeX, leftEyeY, eyeSize, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(leftEyeX, leftEyeY, eyeSize / 2, 0, Math.PI * 2);
            ctx.arc(rightEyeX, leftEyeY, eyeSize / 2, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Game loop
        let lastTime = 0;
        
        function gameLoop(currentTime) {
            const deltaTime = (currentTime - lastTime) / 1000; // Convert to seconds
            lastTime = currentTime;
            
            // Cap delta time to prevent issues
            if (deltaTime > 0.1) {
                lastTime = currentTime;
                return;
            }
            
            // Start game if not started and player is moving
            if (!gameState.gameStarted && (keys.left || keys.right || keys.up)) {
                gameState.gameStarted = true;
            }
            
            // Update and draw only if game is started or over
            if (gameState.gameStarted || gameState.gameOver || gameState.gameWon) {
                if (!gameState.gameOver && !gameState.gameWon) {
                    updateGame(deltaTime);
                }
                drawGame();
            } else {
                // Draw start message
                ctx.fillStyle = '#111';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#fff';
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Press any arrow key to start', canvas.width / 2, canvas.height / 2);
                
                ctx.font = '16px Arial';
                ctx.fillText('Use arrow keys to move, UP to jump, SPACE to shoot', canvas.width / 2, canvas.height / 2 + 40);
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // Start game loop
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
